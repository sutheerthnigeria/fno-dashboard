name: Daily data update

on:
  schedule:
    - cron: "40 13 * * 1-5"   # 19:10 IST, after NSE publishes bhavcopies
    - cron: "40 16 * * 1-5"   # 22:10 IST, retry in case files were late
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days to (back)fill"
        default: "10"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download NSE files
        run: python pipeline/fetch_nse.py --days ${{ github.event.inputs.days || '10' }}
      - name: Build site data
        run: python pipeline/build.py --prune-raw
      - name: Fetch NSE news
        run: python pipeline/fetch_news.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "fno-bot"
          git config user.email "fno-bot@users.noreply.github.com"
          git add data/daily data/missing.json data/sectors.csv data/banlist.json data/tv_technicals.json site/data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
